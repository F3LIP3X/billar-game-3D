<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Billar 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="start">
      <div class="start-inner">
        <p class="eyebrow">Bola 8 · 2 jugadores</p>
        <h1 class="title">Billar <span>3D</span></h1>
        <button id="play">Jugar</button>
      </div>
    </div>

    <div id="hud" hidden>
      <div id="message"></div>

      <aside class="player" data-player="0">
        <span class="name">Jugador 1</span>
        <span class="group"></span>
        <div class="tray"></div>
      </aside>
      <aside class="player" data-player="1">
        <span class="name">Jugador 2</span>
        <span class="group"></span>
        <div class="tray"></div>
      </aside>


      <div class="bottom">
        <div class="shot-row">
          <button id="spin" aria-label="Efecto: pulsa arriba para seguir, abajo para retroceso">
            <span class="spin-ball"><span id="spin-dot"></span></span>
            <span id="spin-label">Centro</span>
          </button>
          <div id="power"><div id="power-fill"></div></div>
          <div class="views" role="group" aria-label="Cámara">
            <button data-view="3d" class="on">3D</button>
            <button data-view="2d">2D</button>
            <button data-view="cue">Tras la bola</button>
          </div>
        </div>

        <div id="touch-controls">
          <div class="fine">
            <button data-fine="-1" aria-label="Girar a la izquierda">‹</button>
            <button data-fine="1" aria-label="Girar a la derecha">›</button>
          </div>
          <button id="shoot-btn">Mantén para tirar</button>
        </div>


        <p class="help">
          Mueve el ratón para apuntar · Mantén clic para cargar, suelta para tirar · Shift + ratón o ← →: ajuste fino · ↑ ↓ efecto ·
          Clic derecho: girar · Botón central: desplazar · Rueda: zoom · 1 / 2 / V: vistas 3D, 2D y tras la bola
        </p>
      </div>

      <div id="overlay" hidden>
        <div class="card">
          <h2 id="overlay-title"></h2>
          <button id="restart">Jugar otra vez</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
